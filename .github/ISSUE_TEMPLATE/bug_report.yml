name: Bug report
description: Something does not work as the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit, plus your OS / browser / runtime version.
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
